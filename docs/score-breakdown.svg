<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="880" height="360" rx="10" fill="#ffffff"/>
<text x="30" y="40" font-size="19" font-weight="600" fill="#1f2328">How a PRLens risk score is built</text>
<text x="30" y="63" font-size="13" fill="#59636e">Each bar is the sum of five weighted factors (weight × factor value, 0–1). Three example pull requests.</text>
<rect x="250.0" y="95" width="177.0" height="190" fill="#f6f8fa"/>
<text x="338.5" y="87" font-size="12" text-anchor="middle" fill="#59636e">low</text>
<rect x="427.0" y="95" width="118.0" height="190" fill="#eef1f4"/>
<text x="486.0" y="87" font-size="12" text-anchor="middle" fill="#59636e">medium</text>
<rect x="545.0" y="95" width="118.0" height="190" fill="#f6f8fa"/>
<text x="604.0" y="87" font-size="12" text-anchor="middle" fill="#59636e">high</text>
<rect x="663.0" y="95" width="177.0" height="190" fill="#eef1f4"/>
<text x="751.5" y="87" font-size="12" text-anchor="middle" fill="#59636e">critical</text>
<text x="250.0" y="302" font-size="11" text-anchor="middle" fill="#8c959f">0</text>
<text x="427.0" y="302" font-size="11" text-anchor="middle" fill="#8c959f">30</text>
<text x="545.0" y="302" font-size="11" text-anchor="middle" fill="#8c959f">50</text>
<text x="663.0" y="302" font-size="11" text-anchor="middle" fill="#8c959f">70</text>
<text x="840.0" y="302" font-size="11" text-anchor="middle" fill="#8c959f">100</text>
<text x="30" y="132" font-size="14" font-weight="600" fill="#1f2328">Fix typo</text>
<text x="30" y="150" font-size="11.5" fill="#59636e">4 lines · 1 file · 2 reviewers</text>
<rect x="250.0" y="118" width="14.8" height="34" fill="#2f6fde"><title>Size: 25% × 0.1 = 2.5</title></rect>
<rect x="264.8" y="118" width="14.8" height="34" fill="#e8833a"><title>Review activity: 25% × 0.1 = 2.5</title></rect>
<rect x="279.5" y="118" width="11.8" height="34" fill="#2a9d8f"><title>Complexity: 20% × 0.1 = 2.0</title></rect>
<rect x="291.3" y="118" width="8.8" height="34" fill="#9b5de5"><title>Staleness: 15% × 0.1 = 1.5</title></rect>
<rect x="300.2" y="118" width="26.6" height="34" fill="#d1495b"><title>Reviewers: 15% × 0.3 = 4.5</title></rect>
<text x="334.7" y="140" font-size="14" font-weight="700" fill="#1f2328">13</text>
<text x="30" y="190" font-size="14" font-weight="600" fill="#1f2328">Add chart</text>
<text x="30" y="208" font-size="11.5" fill="#59636e">250 lines · 6 files · 1 reviewer</text>
<rect x="250.0" y="176" width="44.2" height="34" fill="#2f6fde"><title>Size: 25% × 0.3 = 7.5</title></rect>
<rect x="294.2" y="176" width="14.8" height="34" fill="#e8833a"><title>Review activity: 25% × 0.1 = 2.5</title></rect>
<rect x="309.0" y="176" width="35.4" height="34" fill="#2a9d8f"><title>Complexity: 20% × 0.3 = 6.0</title></rect>
<rect x="344.4" y="176" width="26.6" height="34" fill="#9b5de5"><title>Staleness: 15% × 0.3 = 4.5</title></rect>
<rect x="370.9" y="176" width="53.1" height="34" fill="#d1495b"><title>Reviewers: 15% × 0.6 = 9.0</title></rect>
<text x="432.1" y="198" font-size="14" font-weight="700" fill="#1f2328">30</text>
<text x="30" y="248" font-size="14" font-weight="600" fill="#1f2328">Rewrite auth</text>
<text x="30" y="266" font-size="11.5" fill="#59636e">2,000 lines · 32 files · no review</text>
<rect x="250.0" y="234" width="140.1" height="34" fill="#2f6fde"><title>Size: 25% × 0.95 = 23.8</title></rect>
<rect x="390.1" y="234" width="132.8" height="34" fill="#e8833a"><title>Review activity: 25% × 0.9 = 22.5</title></rect>
<rect x="522.9" y="234" width="106.2" height="34" fill="#2a9d8f"><title>Complexity: 20% × 0.9 = 18.0</title></rect>
<rect x="629.1" y="234" width="79.7" height="34" fill="#9b5de5"><title>Staleness: 15% × 0.9 = 13.5</title></rect>
<rect x="708.7" y="234" width="84.1" height="34" fill="#d1495b"><title>Reviewers: 15% × 0.95 = 14.2</title></rect>
<text x="800.8" y="256" font-size="14" font-weight="700" fill="#1f2328">92</text>
<rect x="30" y="323" width="12" height="12" rx="2" fill="#2f6fde"/>
<text x="48" y="333" font-size="12.5" fill="#1f2328">Size (25%)</text>
<rect x="170" y="323" width="12" height="12" rx="2" fill="#e8833a"/>
<text x="188" y="333" font-size="12.5" fill="#1f2328">Review activity (25%)</text>
<rect x="345" y="323" width="12" height="12" rx="2" fill="#2a9d8f"/>
<text x="363" y="333" font-size="12.5" fill="#1f2328">Complexity (20%)</text>
<rect x="505" y="323" width="12" height="12" rx="2" fill="#9b5de5"/>
<text x="523" y="333" font-size="12.5" fill="#1f2328">Staleness (15%)</text>
<rect x="660" y="323" width="12" height="12" rx="2" fill="#d1495b"/>
<text x="678" y="333" font-size="12.5" fill="#1f2328">Reviewers (15%)</text>
</svg>
